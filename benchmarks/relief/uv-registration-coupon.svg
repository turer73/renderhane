<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="70mm" height="70mm" viewBox="0 0 70 70">
  <title>Renderhane Relief Pro UV Registration Coupon v1</title>
  <desc>70 mm calibration artwork. Keep all layers on the same 70×70 mm canvas. Use the CUT, COLOR, WHITE and VARNISH groups as separate RIP layers.</desc>

  <g id="CUT" fill="none" stroke="#000000" stroke-width="0.10">
    <rect x="0.5" y="0.5" width="69" height="69" rx="2" ry="2"/>
    <line x1="35" y1="0.5" x2="35" y2="4.5"/>
    <line x1="35" y1="65.5" x2="35" y2="69.5"/>
    <line x1="0.5" y1="35" x2="4.5" y2="35"/>
    <line x1="65.5" y1="35" x2="69.5" y2="35"/>
  </g>

  <g id="WHITE" fill="#000000" stroke="none">
    <circle cx="10" cy="10" r="3"/>
    <circle cx="60" cy="10" r="3"/>
    <circle cx="10" cy="60" r="3"/>
    <circle cx="60" cy="60" r="3"/>
    <rect x="15" y="31" width="40" height="8" rx="1"/>
  </g>

  <g id="COLOR" fill="none" stroke="#000000" stroke-width="0.20">
    <g id="corner-target-top-left" transform="translate(10 10)">
      <circle r="4"/><circle r="2"/><line x1="-6" y1="0" x2="6" y2="0"/><line x1="0" y1="-6" x2="0" y2="6"/>
    </g>
    <g id="corner-target-top-right" transform="translate(60 10)">
      <circle r="4"/><circle r="2"/><line x1="-6" y1="0" x2="6" y2="0"/><line x1="0" y1="-6" x2="0" y2="6"/>
    </g>
    <g id="corner-target-bottom-left" transform="translate(10 60)">
      <circle r="4"/><circle r="2"/><line x1="-6" y1="0" x2="6" y2="0"/><line x1="0" y1="-6" x2="0" y2="6"/>
    </g>
    <g id="corner-target-bottom-right" transform="translate(60 60)">
      <circle r="4"/><circle r="2"/><line x1="-6" y1="0" x2="6" y2="0"/><line x1="0" y1="-6" x2="0" y2="6"/>
    </g>

    <line x1="5" y1="35" x2="65" y2="35" stroke-width="0.10"/>
    <line x1="35" y1="5" x2="35" y2="65" stroke-width="0.10"/>

    <g id="x-scale">
      <line x1="15" y1="27" x2="55" y2="27"/>
      <line x1="15" y1="26" x2="15" y2="28"/>
      <line x1="20" y1="26.3" x2="20" y2="27.7"/>
      <line x1="25" y1="26.3" x2="25" y2="27.7"/>
      <line x1="30" y1="26.3" x2="30" y2="27.7"/>
      <line x1="35" y1="26" x2="35" y2="28"/>
      <line x1="40" y1="26.3" x2="40" y2="27.7"/>
      <line x1="45" y1="26.3" x2="45" y2="27.7"/>
      <line x1="50" y1="26.3" x2="50" y2="27.7"/>
      <line x1="55" y1="26" x2="55" y2="28"/>
    </g>

    <rect x="15" y="31" width="40" height="8" rx="1"/>
    <path d="M15 42 H55 M15 44 H55 M15 46 H55" stroke-width="0.10"/>
  </g>

  <g id="VARNISH" fill="none" stroke="#000000" stroke-width="0.30">
    <rect x="17" y="32.5" width="36" height="5" rx="0.7"/>
    <circle cx="35" cy="52" r="5"/>
  </g>

  <g id="LABELS" fill="#000000" font-family="Arial, sans-serif" font-size="2.2">
    <text x="35" y="18" text-anchor="middle">RENDERHANE UV REGISTRATION 70 mm</text>
    <text x="35" y="21" text-anchor="middle">Measure X/Y offset at four targets</text>
    <text x="35" y="36.2" text-anchor="middle" fill="#ffffff">COLOR / WHITE ALIGNMENT</text>
    <text x="35" y="49" text-anchor="middle">VARNISH TARGET</text>
    <text x="35" y="68" text-anchor="middle">v1 · do not scale · preserve 70×70 mm canvas</text>
  </g>
</svg>
