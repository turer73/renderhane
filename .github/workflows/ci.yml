name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run type-check

  relief-worker:
    name: Relief Worker — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: workers/relief/requirements*.txt

      - name: Install worker dependencies
        run: python -m pip install -r workers/relief/requirements-dev.txt

      - name: Run relief worker tests
        run: python -m pytest workers/relief/tests -q

      - name: Generate rights-safe Kapadokya fixture
        run: |
          mkdir -p phase0-artifacts
          python benchmarks/relief/generate_synthetic_kapadokya.py \
            --out-dir phase0-artifacts/kapadokya-inputs

      - name: Run four-depth digital smoke benchmark
        run: |
          python workers/relief/run_phase0_benchmark.py \
            --relief-map phase0-artifacts/kapadokya-inputs/manual-relief-map-16.png \
            --mask phase0-artifacts/kapadokya-inputs/alpha-mask.png \
            --front-master phase0-artifacts/kapadokya-inputs/front-master.png \
            --uv-artwork phase0-artifacts/kapadokya-inputs/uv-print.png \
            --white-mask phase0-artifacts/kapadokya-inputs/white-mask.png \
            --varnish-mask phase0-artifacts/kapadokya-inputs/varnish-mask.png \
            --out-dir phase0-artifacts/kapadokya-benchmark \
            --width-mm 70 \
            --base-thickness-mm 3 \
            --depths 0.6,1.0,1.4,1.8 \
            --grid-long-edge 96 \
            --artwork-long-edge-px 512

      - name: Generate UV clearance coupon
        run: |
          python workers/relief/generate_uv_clearance_coupon.py \
            --out-dir phase0-artifacts/uv-coupon \
            --grid-long-edge 96

      - name: Enforce digital and physical status separation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path('phase0-artifacts/kapadokya-benchmark/benchmark-summary.json').read_text())
          assert summary['digital_benchmark_status'] == 'validated'
          assert summary['physical_benchmark_status'] == 'pending'
          assert summary['uv_benchmark_status'] == 'pending'
          assert summary['default_relief_depth_mm'] is None

          coupon = json.loads(Path('phase0-artifacts/uv-coupon/build/manufacturing-report.json').read_text())
          assert coupon['validation']['digital_status'] == 'validated'
          assert coupon['validation']['production_status'] == 'physical_validation_required'
          PY

      - name: Upload digital smoke artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relief-phase0-python-${{ matrix.python-version }}
          path: phase0-artifacts/
          if-no-files-found: error
          retention-days: 7

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  migration-contract:
    name: PostgreSQL Migration Contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bootstrap disposable credit schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap_credit_schema.sql

      - name: Apply Social Kit migrations
        run: |
          psql --single-transaction -v ON_ERROR_STOP=1 -f supabase/migrations/20260830_reserve_credit_bundle.sql
          psql --single-transaction -v ON_ERROR_STOP=1 -f supabase/migrations/20260831_social_kit_request_idempotency.sql

      - name: Verify SQL contracts
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/reserve_credit_bundle_test.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/social_kit_request_idempotency_test.sql
          bash supabase/tests/social_kit_concurrency_test.sh

      - name: Reapply migrations and contracts
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE VIEW public.social_kit_claim_contract_dependency AS
          SELECT *
          FROM public.claim_social_kit_request(
            '00000000-0000-0000-0000-000000000303'::UUID,
            'dependency-check-key',
            repeat('e', 64)
          );
          SQL
          psql --single-transaction -v ON_ERROR_STOP=1 -f supabase/migrations/20260830_reserve_credit_bundle.sql
          psql --single-transaction -v ON_ERROR_STOP=1 -f supabase/migrations/20260831_social_kit_request_idempotency.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/reserve_credit_bundle_test.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/social_kit_request_idempotency_test.sql
          bash supabase/tests/social_kit_concurrency_test.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-typecheck, test, migration-contract]
    # Required GitHub checks treat a dependency-skipped job as successful.
    # Always start Build, then fail it explicitly unless every prerequisite
    # succeeded so the required Build context is a real migration gate.
    if: ${{ always() }}
    steps:
      - name: Require successful prerequisites
        run: |
          test "${{ needs.lint-typecheck.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.migration-contract.result }}" = "success"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
