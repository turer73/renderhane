name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run type-check

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  migration-contract:
    name: PostgreSQL Migration Contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bootstrap disposable credit schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap_credit_schema.sql

      - name: Apply Social Kit migrations
        run: |
          psql --single-transaction -v ON_ERROR_STOP=1 -f supabase/migrations/20260830_reserve_credit_bundle.sql
          psql --single-transaction -v ON_ERROR_STOP=1 -f supabase/migrations/20260831_social_kit_request_idempotency.sql

      - name: Verify SQL contracts
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/reserve_credit_bundle_test.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/social_kit_request_idempotency_test.sql
          bash supabase/tests/social_kit_concurrency_test.sh

      - name: Reapply migrations and contracts
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE VIEW public.social_kit_claim_contract_dependency AS
          SELECT *
          FROM public.claim_social_kit_request(
            '00000000-0000-0000-0000-000000000303'::UUID,
            'dependency-check-key',
            repeat('e', 64)
          );
          SQL
          psql --single-transaction -v ON_ERROR_STOP=1 -f supabase/migrations/20260830_reserve_credit_bundle.sql
          psql --single-transaction -v ON_ERROR_STOP=1 -f supabase/migrations/20260831_social_kit_request_idempotency.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/reserve_credit_bundle_test.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/social_kit_request_idempotency_test.sql
          bash supabase/tests/social_kit_concurrency_test.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-typecheck, test, migration-contract]
    # Required GitHub checks treat a dependency-skipped job as successful.
    # Always start Build, then fail it explicitly unless every prerequisite
    # succeeded so the required Build context is a real migration gate.
    if: ${{ always() }}
    steps:
      - name: Require successful prerequisites
        run: |
          test "${{ needs.lint-typecheck.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.migration-contract.result }}" = "success"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
