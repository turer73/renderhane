name: Relief Product Geometry

on:
  push:
    branches:
      - feature/manufacturing-relief-mvp
    paths:
      - "workers/relief/**"
      - ".github/workflows/relief-product.yml"
  pull_request:
    paths:
      - "workers/relief/**"
      - ".github/workflows/relief-product.yml"

permissions:
  contents: read

jobs:
  product-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: workers/relief/requirements-manufacturing.txt

      - name: Install manufacturing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r workers/relief/requirements-manufacturing.txt

      - name: Run manufacturing worker tests
        run: python -m pytest workers/relief/tests -q

      - name: Build silhouette-trimmed fixture with magnet pocket
        run: |
          python workers/relief/generate_synthetic_benchmark.py \
            --output /tmp/relief-product-fixture \
            --width 192 \
            --height 192
          python workers/relief/product_relief_builder.py \
            --relief-map /tmp/relief-product-fixture/relief-map-16.png \
            --mask /tmp/relief-product-fixture/silhouette-mask.png \
            --output /tmp/relief-product-output \
            --width-mm 70 \
            --height-mm 70 \
            --base-mm 3 \
            --relief-mm 1.2 \
            --grid-long-edge 128 \
            --pocket-diameter-mm 12 \
            --pocket-depth-mm 2

      - name: Upload digital evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relief-product-geometry
          path: |
            /tmp/relief-product-fixture
            /tmp/relief-product-output
          if-no-files-found: warn
          retention-days: 14
