<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Renderhane brand: 3D wireframe cube + R monogram. Indigo-600 #4F46E5 + Pink-500 #EC4899 accent -->
  <defs>
    <linearGradient id="rh-grad" x1="0" y1="0" x2="64" y2="64">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <!-- Wireframe cube (isometric) -->
  <g stroke="url(#rh-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Front face -->
    <path d="M14 22 L14 50 L38 56 L38 28 Z"/>
    <!-- Top face -->
    <path d="M14 22 L30 14 L54 20 L38 28 Z"/>
    <!-- Right face -->
    <path d="M38 28 L54 20 L54 48 L38 56 Z"/>
    <!-- Hidden edges (lighter) -->
    <path d="M30 14 L30 42 L14 50" stroke-opacity="0.35"/>
    <path d="M30 42 L54 48" stroke-opacity="0.35"/>
  </g>
  <!-- R monogram inside cube front face -->
  <text x="26" y="48" font-family="'Geist Sans', 'Inter', system-ui, sans-serif" font-weight="800" font-size="22" fill="#EC4899" text-anchor="middle">R</text>
</svg>
