<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Renderhane favicon — brand cube + R monogram on indigo gradient. Static SVG (browser-rendered, no Satori font dependency). -->
  <defs>
    <linearGradient id="rh-fav-bg" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="rh-fav-cube" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#rh-fav-bg)"/>
  <g stroke="url(#rh-fav-cube)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="translate(256 256) scale(4.5) translate(-32 -32)">
    <path d="M14 22 L14 50 L38 56 L38 28 Z"/>
    <path d="M14 22 L30 14 L54 20 L38 28 Z"/>
    <path d="M38 28 L54 20 L54 48 L38 56 Z"/>
    <path d="M30 14 L30 42 L14 50" stroke-opacity="0.45"/>
    <path d="M30 42 L54 48" stroke-opacity="0.45"/>
  </g>
  <text x="256" y="320" font-family="system-ui, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="180" fill="#EC4899" text-anchor="middle">R</text>
</svg>
